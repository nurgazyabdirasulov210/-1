<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Магия рук</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="fx"></canvas>

<div id="hint">
  <span>☝️ Один палец — рисуем неоновую линию</span>
  <span>✊ Сжатый кулак — появляются звёздочки</span>
  <span>🖐 Раскрытая ладонь — звёзды улетают</span>
</div>

<div id="start">
  <h1>Магия рук</h1>
  <p>Рисуй пальцем в воздухе, ставь звёзды кулаком и запускай их ладонью.</p>
  <button id="startBtn">Включить камеру</button>
  <p id="status"></p>
</div>

<div id="tools" hidden>
  <button id="clearBtn">Очистить</button>
  <button id="shotBtn">Фото</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
