<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Магия рук</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="fx"></canvas>

<div id="mode">Покажи руку в камеру</div>

<div id="hint">
  <span>☝️ Указательный палец — неоновая линия</span>
  <span>✊ Вторая рука в кулак — палец рисует звёзды</span>
  <span>🖐 Разожми вторую руку — звёзды улетают</span>
</div>

<div id="start">
  <h1>Магия рук</h1>
  <p>Рисуй пальцем в воздухе. Сожми вторую руку в кулак, чтобы рисовать звёзды, а потом раскрой ладонь, и они улетят.</p>
  <button id="startBtn">Включить камеру</button>
  <p id="status"></p>
</div>

<div id="tools" hidden>
  <button id="undoBtn">↶ Отменить</button>
  <button id="clearBtn">Очистить</button>
  <button id="shotBtn">📷 Фото</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
